plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.korzina.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.korzina.app"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        main {
            storeFile file('korzina.keystore')
            storePassword 'korzina2026'
            keyAlias 'korzina'
            keyPassword 'korzina2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.main
        }
        release {
            signingConfig signingConfigs.main
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
