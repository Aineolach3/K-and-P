/* Layout: desktop web app — fixed left sidebar, top bar with page title and actions, content grid up to 1240px; collapses to top nav on narrow screens. Cuisine sets the accent pair. */
:root{
  --bg:#101215; --surface:#181b20; --sunk:#20242a; --hover:#22262d; --line:#2a2f37; --line2:#383e48;
  --fg:#eceef2; --muted:#a3aab5; --faint:#6d7480;
  --good:#5fd08f; --warn:#f0b04a; --bad:#ff8a80;
  --c1:#b3261e; --c2:#b8901a; --c1d:#e0675c; --c2d:#cfae4a;
  --acc:var(--c1d); --acc2:var(--c2d); --on-acc:#111317;
  --tint:color-mix(in srgb,var(--acc) 12%,var(--surface));
  --shadow:none; color-scheme:dark;
  --display:"Inter Display","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --side:248px;
}
:root[data-cu="ru"]{--c1:#b3261e;--c2:#b8901a;--c1d:#e0675c;--c2d:#cfae4a}
:root[data-cu="it"]{--c1:#2e7d32;--c2:#c62828;--c1d:#5fae64;--c2d:#e07a72}
:root[data-cu="vn"]{--c1:#2f7d4a;--c2:#d62828;--c1d:#5aae78;--c2d:#e0706a}
:root[data-cu="jp"]{--c1:#bc002d;--c2:#2f3d63;--c1d:#e4577a;--c2d:#8797c8}
:root[data-cu="ge"]{--c1:#8e1b3a;--c2:#5f7f1f;--c1d:#cf6283;--c2d:#9bb85a}
:root[data-cu="mx"]{--c1:#c9541a;--c2:#0f7f81;--c1d:#e88a4f;--c2d:#4cb6b8}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:700} h2{font-size:1.06rem;font-weight:700} h3{font-size:.95rem;font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.06rem;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:var(--on-acc);flex:none}
.logo svg{width:18px;height:18px}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.logo{overflow:hidden;background:#1a1410}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:500;font-size:.94rem;color:var(--muted);cursor:pointer;text-align:left;white-space:nowrap}
nav.tabs button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button:hover{background:var(--hover);color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--tint);color:var(--acc);font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:10px}
.cucard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--surface);cursor:pointer;text-align:left}
.cucard:hover{border-color:var(--line2)}
.cucard .sw{display:flex;height:6px;border-radius:9px;overflow:hidden}
.cucard .sw i{flex:1;background:var(--acc)} .cucard .sw i+i{background:var(--acc2)}
.cucard small{color:var(--muted);font-size:.78rem}
.cucard b{font-size:.9rem;font-weight:600}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin,.wrap{max-width:1240px;margin:0 auto;width:100%;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px}
.ttl{margin-right:auto;min-width:0}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:.88rem;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--line2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
select.chip{padding-right:8px}
.mbrand{display:none}

main{padding-block:24px 64px;display:grid;gap:20px}
.demo .tag{flex:none}
.demo{display:flex;gap:10px;align-items:center;border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface));padding:10px 14px;border-radius:var(--r);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.panel>h2,.panel>.ph{margin-bottom:14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.split>.panel:first-child{position:sticky;top:96px}
.lab{font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-size:1.65rem;font-weight:700;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{display:grid;gap:2px;padding:14px 16px;border-right:1px solid var(--line);margin-right:-1px}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:16px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.meter i.over{background:var(--bad)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.1);background:var(--acc)}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:500;font-size:.87rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .4)}

/* Покупка: цена → итог и цена за единицу */
function calc(p){
  const tp=+p.tagPrice||0,g=+p.grams||0,q=+p.qty||1;
  let paid=0,total=0,kind='kg';
  if(p.basis==='piece'){paid=tp*q;total=g?g*q:0;kind=total?(p.liquid?'l':'kg'):'pcs'}
  else if(p.basis==='kg'){paid=tp*g/1000;total=g;kind='kg'}
  else if(p.basis==='100g'){paid=tp*g/100;total=g;kind='kg'}
  else if(p.basis==='l'){paid=tp*g/1000;total=g;kind='l'}
  const unit=total?paid/(total/1000):(q?paid/q:paid);
  return {paid:Math.round(paid*100)/100,total,kind,unit:Math.round(unit*100)/100}
}

// Сравнение цен по типу: для каждого магазина — лучшая цена за ед. (последние 90 дней)
function priceTable(){
  const lim=new Date();lim.setDate(lim.getDate()-90);const L=lim.toISOString().slice(0,10);
  const g={};
  purchases().forEach(p=>{if(!p.type)return;(g[p.type]=g[p.type]||[]).push(p)});
  const res={};
  for(const t in g){
    const kinds={};g[t].forEach(p=>kinds[p.kind]=(kinds[p.kind]||0)+1);
    const kind=Object.entries(kinds).sort((a,b)=>b[1]-a[1])[0][0];
    const rows=g[t].filter(p=>p.kind===kind);
    const recent=rows.filter(p=>p.date>=L);const use=recent.length?recent:rows;
    const st={};use.forEach(p=>{if(!st[p.store]||p.unit<st[p.store].unit)st[p.store]=p});
    const list=Object.values(st).sort((a,b)=>a.unit-b.unit);
    const brands=[...use].sort((a,b)=>a.unit-b.unit);
    res[t]={kind,list,brands};
  }
  return res;
}
// Рекомендация магазинов для набора типов
function storeRec(types,grams){
  const pt=priceTable();const stores=[...new Set(purchases().map(p=>p.store))];
  const rows=stores.map(s=>{let cover=0,cost=0;types.forEach(t=>{const e=pt[t]&&pt[t].list.find(x=>x.store===s);if(e){cover++;cost+=costOf(t,grams?grams[t]:null,e)}});return {s,cover,cost}});
  rows.sort((a,b)=>b.cover-a.cover||a.cost-b.cost);
  let split=0,known=0;const pick={};
  types.forEach(t=>{const e=pt[t]&&pt[t].list[0];if(e){known++;split+=costOf(t,grams?grams[t]:null,e);pick[t]=e}});
  return {rows,split,known,pick,pt};
}
function costOf(t,g,e){ // стоимость g грамм (или «одной типичной покупки», если g не задан)
  if(g==null)return e.paid;
  if(e.kind==='pcs'){const pg=P[t]&&P[t][5];return pg?e.unit*(g/pg):e.unit*Math.max(1,Math.round(g/100))}
  return e.unit*g/1000;
}

function priceAlerts(){const out=[];const g={};purchases().forEach(p=>{if(P[p.type])(g[p.type]=g[p.type]||[]).push(p)});
  for(const t in g){const kinds={};g[t].forEach(p=>kinds[p.kind]=(kinds[p.kind]||0)+1);const kind=Object.entries(kinds).sort((a,b)=>b[1]-a[1])[0][0];
    const rows=g[t].filter(p=>p.kind===kind).sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));if(rows.length<3)continue;
    const last=rows[rows.length-1];const prev=rows.slice(0,-1).map(p=>p.unit).sort((a,b)=>a-b);const med=prev[Math.floor(prev.length/2)];const d=last.unit/med-1;
    if(Math.abs(d)>=.1)out.push({t,d,last,med,kind})}
  return out.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))}

function chartMonths(ms,m){
  const W=460,H=200,pl=8,pb=26,pt=22;const vals=ms.map(k=>m[k]||0);const B0=+S.settings.budget||0;const vm=Math.max(1,...vals);const showB=B0&&B0<=vm*1.6;const mx=(showB?Math.max(vm,B0):vm)*1.12;
  const bw=(W-pl*2)/ms.length;const y=v=>H-pb-(v/mx)*(H-pb-pt);const B=+S.settings.budget||0;
  let s=(B&&!showB?`<p class="hint" style="margin:0 0 6px">Бюджет ${money(B,0)} в месяц — траты пока сильно ниже.</p>`:'')+`<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Траты по месяцам">`;
  if(showB){s+=`<line x1="${pl}" x2="${W-pl}" y1="${y(B)}" y2="${y(B)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${W-pl}" y="${y(B)-5}" text-anchor="end">бюджет ${money(B,0)}</text>`}
  vals.forEach((v,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;const cur=i===ms.length-1;
    s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,H-pb-y(v))}" rx="5" fill="${cur?'var(--acc)':'color-mix(in srgb,var(--acc) 35%,var(--sunk))'}"/>`;
    if(v)s+=`<text x="${x+w/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${Math.round(v/100)/10}k</text>`;
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${MS[+ms[i].slice(5)-1]}</text>`});
  return s+'</svg></div>';
}
function storeBars(ss){
  if(!ss.length)return '<div class="empty">В этом месяце покупок ещё нет.</div>';
  const mx=ss[0][1];const tot=ss.reduce((a,b)=>a+b[1],0);
  return `<div class="cmp">${ss.map(([s,v],i)=>`<div class="cmp-row"><span class="nm"><b>${i+1}.</b> ${esc(s)}</span><span class="b"><i style="width:${v/mx*100}%;background:${i===0?'var(--acc)':'color-mix(in srgb,var(--acc) 40%,var(--sunk))'}"></i></span><span class="num"><b>${money(v,0)}</b> <span class="muted">${Math.round(v/tot*100)}%</span></span></div>`).join('')}</div>`;
}

function applyCode(code){$('#fCode').value=code;const m=(S.settings.barcodes||{})[code];
  if(m){$('#fName').value=m.name||'';$('#fType').value=m.type&&P[m.type]?P[m.type][0]:'';$('#fStore').value=m.store||$('#fStore').value;$('#fPrice').value=m.tagPrice||'';$('#fBasis').value=m.basis||'piece';$('#fGrams').value=m.grams||'';$('#bcHint').textContent='Узнал товар: '+m.name+'. Проверьте цену.';updateTotals();$('#fPrice').focus()}
  else{$('#bcHint').textContent='Новый штрихкод '+code+' — заполните поля, в следующий раз узнаю';$('#fName').focus()}}
function openDrawer(){botBase('bag');ui.drawer=true;ui.ai=null;ui.photo=null;renderDrawer();setTimeout(()=>$('#fName')&&$('#fName').focus(),60)}
function closeDrawer(){botBase(null);ui.drawer=false;$('#drawer').innerHTML=''}

  f.addEventListener('input',updateTotals);
  f.addEventListener('submit',e=>{e.preventDefault();
    const p=readForm();if(!p.name||!p.store||!p.tagPrice)return;
    if(p.basis!=='piece'&&!p.grams){$('#fGrams').focus();toast('Укажите, сколько граммов купили');return}
    const c=calc(p);const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const rec={id,...p,...c,created:Date.now()};S.purchases.push(rec);savePurchase(rec);const code=($('#fCode')||{}).value;if(code&&code.trim()){S.settings.barcodes={...(S.settings.barcodes||{}),[code.trim()]:{name:p.name,type:p.type,store:p.store,tagPrice:p.tagPrice,basis:p.basis,grams:p.grams}};saveSettings()}if(P[p.type]){fridgeAdd(p.type,c.total||(P[p.type][5]||0)*p.qty||300,p.date);saveSettings()}

  const bc=$('#bcIn');if(bc)bc.addEventListener('change',async()=>{const fl=bc.files[0];if(!fl)return;try{const img=await createImageBitmap(fl);const det=new BarcodeDetector();const r=await det.detect(img);if(!r.length){$('#bcHint').textContent='Штрихкод не найден — снимите ближе и ровнее';return}applyCode(r[0].rawValue)}catch(e){$('#bcHint').textContent='Не удалось прочитать штрихкод — введите цифры вручную'}});
  const fc=$('#fCode');if(fc)fc.addEventListener('change',()=>{if(fc.value.trim())applyCode(fc.value.trim())});

function readForm(){
  const tIn=$('#fType').value.trim();let type='';
  for(const k in P)if(P[k][0].toLowerCase()===tIn.toLowerCase())type=k;
  if(!type)type=guessType(tIn)||guessType($('#fName').value)||(tIn?tIn.toLowerCase():'');

  p.liquid=p.basis==='l'||type==='milk'||type==='kefir';
  return p;
}
function updateTotals(){
  if(!$('#buyForm'))return;

  $('#lGrams').textContent=b==='piece'?'Вес упаковки, г (если есть)':b==='l'?'Сколько купили, мл':'Сколько купили, г';

  if(!$('#fType').value&&$('#fName').value){const g=guessType($('#fName').value);$('#fType').placeholder=g?P[g][0]:'Рис'}
  const p=readForm();const c=calc(p);
  {const fh=$('#fHome');if(fh){const k=p.type&&P[p.type]?p.type:'';fh.innerHTML=k&&fridge().some(f=>f.t===k)?`<span class="pill warn">Напоминание</span> ${esc(tName(k))} — ${esc(stockNote(k))}`:k&&(S.settings.outOf||[]).some(x=>x.t===k)?`<span class="pill bad">Закончилось</span> ${esc(tName(k))} — пора докупить`:''}}

  </section>
  ${sel.length?`<div class="stick"><span><b>${sel.length}</b> продуктов отмечено${rec.rows[0]&&rec.rows[0].cover?` · дешевле всего брать в <b>«${esc(rec.rows[0].s)}»</b>`:''}</span><button class="btn sm" data-act="scroll-basket">Цены и магазины ↓</button></div>`:''}
  <section class="panel"><div class="ph"><h2>Блюда ${goal==='lose'?'для похудения':'для набора веса'} из ваших продуктов</h2><div class="seg" role="group" aria-label="Сортировка">${[['match','Больше совпадений'],['kcal','Меньше ккал'],['time','Быстрее']].map(([k,l])=>`<button aria-pressed="${so===k}" data-act="rsort" data-v="${k}">${l}</button>`).join('')}</div></div>
    ${!have.size?`<div class="empty">Отметьте продукты выше — здесь появятся блюда, в которых они используются.</div>`:

    ${sample?`<div class="row" style="margin-top:16px"><button class="btn" data-act="ai-recipes" ${sel.length?'':'disabled'}>${ui.aiR==='busy'?'<span class="spin"></span> Подбираю…':'Ещё блюда из отмеченного — спросить ИИ'}</button><span class="hint">${sel.length?'Учитываются кухня, цель и отмеченные продукты':'Сначала отметьте продукты'}</span></div>${aiRecipes()}`:''}

  ${balance()}

/* Калькулятор «что выгоднее» */
function calcHTML(){return `<div class="calc" id="calcBox">${[1,2,3].map(i=>`<div class="crow" data-ci="${i}"><span class="lab">Вариант ${i}</span><input class="inp" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Цена, ${cur()}" data-cp="${i}"><input class="inp" type="number" min="0" inputmode="numeric" placeholder="Вес, г или мл" data-cw="${i}"><span class="cres num" data-cr="${i}">—</span></div>`).join('')}<p class="hint" id="calcSum">Введите цену и вес хотя бы двух вариантов.</p></div>`}
function calcUpdate(root){const v=[1,2,3].map(i=>{const p=+root.querySelector(`[data-cp="${i}"]`).value,w=+root.querySelector(`[data-cw="${i}"]`).value;return p&&w?p/w*1000:null});
  const ok=v.map((x,i)=>[x,i]).filter(([x])=>x);const best=ok.length?ok.reduce((a,b)=>a[0]<b[0]?a:b):null;const worst=ok.length?ok.reduce((a,b)=>a[0]>b[0]?a:b):null;
  v.forEach((x,i)=>{const el=root.querySelector(`[data-cr="${i+1}"]`);el.textContent=x?money(x)+'/кг':'—';el.closest('.crow').classList.toggle('best',!!(best&&ok.length>1&&best[1]===i))});
  root.querySelector('#calcSum').innerHTML=ok.length>1?`Выгоднее <b>вариант ${best[1]+1}</b> — дешевле на ${Math.round((1-best[0]/worst[0])*100)}% за кг.`:'Введите цену и вес хотя бы двух вариантов.'}
function openCalc(){const el=document.createElement('div');el.className='modal';el.style.zIndex=60;el.id='calcEl';el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="ph"><h2>Что выгоднее?</h2><button class="iconbtn" data-cx aria-label="Закрыть">×</button></div>${calcHTML()}</div>`;document.body.appendChild(el);
  el.oninput=()=>calcUpdate(el);el.onclick=e=>{if(e.target===el||e.target.closest('[data-cx]'))el.remove()};el.querySelector('[data-cp="1"]').focus()}

const PERIODS={day:[1,'день'],week:[7,'неделю'],month:[30,'месяц']};
function planData(){
  const s=S.settings;const cu=s.cuisine||'ru';const per=ui.plan.period;const days=PERIODS[per][0];const ppl=(s.family||[]).length?(s.family.length+1):(+s.people||1);
  const slots=SLOTS.filter(x=>(s.slots||['Обед','Ужин']).includes(x));const ov=s.menuOv||{};const EA=eaters();const eatF=EA.f;
  const pools={};slots.forEach(sl=>pools[sl]=slotPool(sl));
  const rs=[...new Set(slots.flatMap(sl=>pools[sl].slice(0,8)))];
  const g={};const use={};const menu=[];const d0=new Date();
  for(let d=0;d<days;d++){
    const dt=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+d);const dk=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
    const meals=[];slots.forEach(sl=>{const key=dk+'|'+sl;let r=null;if(key in ov){r=ov[key]?R.find(x=>x.id===ov[key]):null;if(ov[key]===''){meals.push([sl,null,key]);return}}
      if(!r){const pl=pools[sl];if(!pl.length)return;const main=sl==='Обед'||sl==='Ужин';const off=main&&sl==='Ужин'?1:0;r=pl[((main?2*d:d)+off)%pl.length];let tries=0;while(meals.some(m=>m[1]===r)&&tries<pl.length){r=pl[(pl.indexOf(r)+1)%pl.length];tries++}}meals.push([sl,r,key])});
    meals.forEach(([,r])=>{if(!r)return;use[r.id]=(use[r.id]||0)+1;r.ing.forEach(([k,gr])=>{g[k]=(g[k]||0)+gr*eatF})});
    menu.push({dt,dk,meals:meals.filter(m=>m[1]),slotsAll:meals});

  let tot=0,unk=0;const byCat={};
  const items=types.map(t=>{const e=rec.pick[t];const pk=t==='egg'?null:packOf(t);let c=null,q;const home=Math.min(g[t],stockOf(t)||(fridge().some(f=>f.t===t)?g[t]:0));const need=Math.max(0,g[t]-home);
    if(!need){return {t,q:'—',home,need:0,buyG:0,store:'',cost:0,cat:P[t][3]}}
    if(pk&&pk.g>=need*.3){const n=Math.max(1,Math.ceil(need/pk.g-.08));c=n*pk.paid;q=n+' уп. по '+wfmt(pk.g);tot+=c}

  const kcalDay=menu.length?Math.round(menu.reduce((a,m)=>a+m.meals.reduce((b,[,r])=>b+r.kcal,0),0)/menu.length):0;
  return {s,cu,per,days,ppl,rs,menu,g,types,rec,items,byCat,tot,unk,kcalDay,use,slots};
}

function menuCSV(){

function saveFile(name,mime,text){
  if(window.AndroidBridge&&AndroidBridge.saveFile){try{const b64=btoa(unescape(encodeURIComponent(text)));AndroidBridge.saveFile(name,mime.split(';')[0],b64);toast('Файл «'+name+'» сохранён в «Загрузки»')}catch(e){toast('Не удалось сохранить файл')}return}
  const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Файл «'+name+'» сохранён');
}
function printMenu(){

function palItems(){
  const pt=priceTable();const it=[];
  TABS.forEach(([k,l],i)=>it.push({g:'Разделы',em:'',svg:IC[k],t:l,s:String(i+1),run:()=>go(k)}));

  it.push({g:'Действия',em:'👨‍🍳',t:(botOn()?'Скрыть':'Показать')+' помощника',run:()=>botToggle(!botOn())});

  it.push({g:'Действия',em:'📓',t:'Записать еду в дневник',run:()=>go('diary')});
  it.push({g:'Действия',em:'🛒',t:'В магазин по списку',run:()=>{go('plan');shopStart()}});
  it.push({g:'Действия',em:'✍',t:'Добавить свой рецепт',run:openRecipeEditor});
  it.push({g:'Действия',em:'⚙',t:'Настройки, кухня и бюджет',run:()=>openSettings(false)});
  it.push({g:'Действия',em:'⇅',t:'Сменить цель: '+(S.settings.goal==='lose'?'на набор веса':'на похудение'),run:()=>{S.settings.goal=S.settings.goal==='lose'?'gain':'lose';saveSettings();render()}});
  usableR().forEach(r=>it.push({g:'Рецепты',em:r.art[0],t:r.name,s:CUISINES[r.cu].name+' · '+r.kcal+' ккал',run:()=>{ui.tab='cook';ui.recipe=r.id;ui.serv=null;render();scrollTo(0,0)}}));
  Object.keys(P).forEach(k=>{const e=pt[k]&&pt[k].list[0];it.push({g:'Продукты',em:P[k][1],t:P[k][0],s:e?money(e.unit)+'/'+unitLbl(pt[k].kind)+' · '+e.store:P[k][2]+' ккал/100 г',run:()=>go('prices')})});
  return it;

function openPalette(){
  const all=palItems();let q='',sel=0,shown=[];
  $('#palette').innerHTML=`<div class="pal" data-pclose><div class="palbox" role="dialog" aria-modal="true" aria-label="Поиск и команды"><input id="palq" placeholder="Раздел, рецепт, продукт или действие…" autocomplete="off" aria-label="Поиск"><div class="pallist" id="pallist" role="listbox"></div><div class="palfoot"><span><kbd>↑</kbd> <kbd>↓</kbd> выбор</span><span><kbd>Enter</kbd> открыть</span><span><kbd>Esc</kbd> закрыть</span></div></div></div>`;
  const draw=()=>{const ql=q.toLowerCase().trim();shown=all.filter(x=>!ql||(x.t+' '+(x.s||'')).toLowerCase().includes(ql)).slice(0,40);if(sel>=shown.length)sel=Math.max(0,shown.length-1);
    let g='',h='';shown.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<div class="palgrp">${g}</div>`}h+=`<button class="palitem" role="option" data-i="${i}" aria-selected="${i===sel}"><span class="em">${x.svg?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${x.svg}</svg>`:x.em}</span><span>${esc(x.t)}</span>${x.s?`<small>${esc(x.s)}</small>`:''}</button>`});
    $('#pallist').innerHTML=h||'<div class="empty" style="margin:8px">Ничего не найдено</div>';const cur=$('#pallist [aria-selected="true"]');if(cur)cur.scrollIntoView({block:'nearest'})};
  const run=i=>{const x=shown[i];closePalette();if(x)x.run()};
  draw();const inp=$('#palq');inp.focus();
  inp.oninput=()=>{q=inp.value;sel=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(shown.length-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter'){run(sel);e.preventDefault()}else if(e.key==='Escape'){closePalette();e.stopPropagation()}};
  $('#palette').onclick=e=>{const b=e.target.closest('.palitem');if(b)return run(+b.dataset.i);if(e.target.hasAttribute('data-pclose'))closePalette()};
}
function closePalette(){$('#palette').innerHTML=''}
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='л'||e.key==='K')){e.preventDefault();$('#palette').innerHTML?closePalette():openPalette();return}
  if(e.key==='Escape'){if($('#msheet').innerHTML){closeSheet();return}if($('#palette').innerHTML)closePalette();else if(ui.drawer)closeDrawer();else if($('#modal').innerHTML&&S.settings.cuisine){$('#modal').innerHTML='';render()}return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||$('#modal').innerHTML||$('#palette').innerHTML||ui.drawer)return;
  if(e.key==='n'||e.key==='т'){e.preventDefault();openDrawer()}
  else if(e.key==='/'){e.preventDefault();openPalette()}

function botAnswer(q,strict){const t=q.toLowerCase().replace(/ё/g,'е').trim();const out=[];const say=(text,btns)=>out.push({text,btns:btns||[]});
  const h=new Date().getHours();
  if(!strict&&/^(привет|здравств|хай|добр|салют|шеф)/.test(t)){say((h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер')+'! Я '+botName()+'. Спросите, что приготовить, что купить или что заканчивается.',[{t:'Что приготовить?',q:'что приготовить'},{t:'Что купить?',q:'что купить'}]);return out}
  if(!strict&&/помощ|умеешь|что ты|команд/.test(t)){say('Я умею:\n• подобрать блюдо из того, что лежит в холодильнике\n• собрать список покупок и добавить в него продукт («добавь молоко»)\n• напомнить, что заканчивается или скоро испортится\n• рассказать о тратах и калориях за день\n• подсказать, где продукт дешевле («где дешевле рис»)\n• открыть рецепт («рецепт борщ»)'+(sample?'\nНа остальные вопросы отвечу с помощью ИИ.':''));return out}
  let m=t.match(/(?:добавь|купить|запиши|внеси)\s+(.+?)(?:\s+в\s+список)?$/);if(m&&!/что/.test(m[1])){const items=m[1].split(/,|\sи\s/).map(x=>x.trim()).filter(Boolean);const ok=[],bad=[];items.forEach(x=>{const k=guessType(x);if(k){shopAdd(k,defG(k));ok.push(k)}else bad.push(x)});saveSettings();render();
    if(ok.length){botReact('happy');say('Добавил в список: '+ok.map(tName).join(', ')+'.'+ok.filter(k=>fridge().some(f=>f.t===k)).map(k=>'\nНапоминаю: '+tName(k)+' — '+stockNote(k)+'.').join(''),[{t:'Открыть список',act:()=>{botClose();go('fridge')}}])}if(bad.length)say('Не знаю продукт: '+bad.join(', ')+'.');return out}
  m=t.match(/рецепт\s+(.+)/);if(m){const r=usableR().find(x=>x.name.toLowerCase().replace(/ё/g,'е').includes(m[1]));if(r){say('Нашёл: '+r.name+' — '+r.kcal+' ккал, '+r.time+' мин.',[rLink(r)]);return out}}
  m=t.match(/(?:где|в каком магазине).*дешевл[а-я]*\s+(.+)/)||t.match(/дешевл[а-я]*\s+(.+)/);if(m){const k=guessType(m[1]);const pt=priceTable();if(k&&pt[k]){const l=pt[k].list;say(tName(k)+': дешевле всего в «'+l[0].store+'» — '+money(l[0].unit)+'/'+unitLbl(pt[k].kind)+(l.length>1?', дороже всего в «'+l[l.length-1].store+'» — '+money(l[l.length-1].unit)+'.':'.'));}else say(k?'По продукту «'+tName(k)+'» у меня пока нет цен — добавьте покупки.':'Не понял, какой продукт.');return out}
  if(strict)return null;
  if(/приготов|что поесть|ужин|обед|завтрак|голод/.test(t)){const have=new Set(fridge().map(f=>f.t));if(!have.size){say('Холодильник пуст, поэтому подскажу из книги рецептов. Отметьте продукты в «Что приготовить» — подберу точнее.',[{t:'Открыть подбор',act:()=>{botClose();go('cook')}}]);return out}
    const c=cookableFrom(have);const soon=fridgeSoon().map(f=>f.t);const pick=c.ready.slice(0,3);
    if(pick.length)say('Из того, что есть дома, можно приготовить:',pick.map(x=>rLink(x.r)));
    if(c.almost.length)say('Если докупить один продукт:',c.almost.slice(0,3).map(x=>({t:x.r.name+' (+'+tName(x.miss[0][0])+')',act:rLink(x.r).act})));
    if(!pick.length&&!c.almost.length)say('Из того, что в холодильнике, пока ничего не складывается. Добавить продукты в список?',[{t:'Что купить?',q:'что купить'}]);
    if(soon.length)say('Сначала лучше использовать: '+[...new Set(soon)].map(tName).join(', ')+' — скоро испортится.');return out}
  if(/купить|список|закуп|магазин|докуп/.test(t)){const al=stockAlerts(),sg=adaptOn()?buySuggest():[];const sl=S.settings.shop?S.settings.shop.items.filter(i=>!i.done):[];
    if(sl.length)say('В списке уже: '+sl.slice(0,8).map(i=>tName(i.t)).join(', ')+(sl.length>8?' и ещё '+(sl.length-8):'')+'.',[{t:'В магазин',act:()=>{botClose();drawShop()}}]);
    if(al.length)say('Заканчивается: '+al.map(a=>tName(a.t)).join(', ')+'.',[{t:'Добавить в список',act:()=>{al.forEach(a=>shopAdd(a.t,stockFull(a.t)||defG(a.t)));saveSettings();render();botReact('happy');botSay('Добавил ✓')}}]);
    if(sg.length)say('Вы обычно покупаете: '+sg.slice(0,5).map(x=>tName(x.t)).join(', ')+'.',[{t:'Добавить все',act:()=>{sg.forEach(x=>shopAdd(x.t,x.g));saveSettings();render();botReact('happy');botSay('Готово, всё в списке ✓')}}]);
    if(!sl.length&&!al.length&&!sg.length)say('Пока всё есть. Могу собрать список из меню на неделю.',[{t:'План закупок',act:()=>{botClose();go('plan')}}]);return out}
  if(/заканч|испорт|срок|холодильник|что есть дома/.test(t)){const fl=fridge();if(!fl.length){say('Холодильник пуст.');return out}const soon=fridgeSoon(),al=stockAlerts();
    say('Дома '+fl.length+' '+plural(fl.length,'продукт','продукта','продуктов')+'.'+(soon.length?'\nСкоро испортится: '+soon.map(f=>tName(f.t)).join(', ')+'.':'')+(al.length?'\nЗаканчивается: '+al.map(a=>tName(a.t)).join(', ')+'.':'')+(!soon.length&&!al.length?'\nВсё свежее, запасы в порядке.':''),[{t:'Открыть холодильник',act:()=>{botClose();go('fridge')}}]);return out}
  if(/трат|потрат|бюджет|деньг|сколько.*руб/.test(t)){const cm=mkey(today());const sp=byMonth()[cm]||0;const B=+S.settings.budget||0;const ss=storeSpend(cm);
    say('В этом месяце потрачено '+money(sp,0)+(B?' из '+money(B,0)+' ('+Math.round(sp/B*100)+'%)':'')+'.'+(ss.length?'\nБольше всего — в «'+ss[0][0]+'»: '+money(ss[0][1],0)+'.':''),[{t:'Обзор',act:()=>{botClose();go('home')}}]);return out}
  if(/калор|ккал|съел|дневник|норм/.test(t)){const es=diary().filter(e=>e.d===today());const k=es.reduce((a,e)=>a+e.kcal,0);const N=normK();say('Сегодня съедено '+k+' из '+N+' ккал. '+(k<N?'Осталось '+(N-k)+' ккал.':'Норма выполнена.'),[{t:'Дневник',act:()=>{botClose();go('diary')}}]);return out}
  if(/выгодн|сравни/.test(t)){say('Открою калькулятор — введите цену и вес упаковок.',[{t:'Что выгоднее?',act:()=>{botClose();openCalc()}}]);return out}
  if(/меню|на неделю|план/.test(t)){say('Меню и список закупок — в «Плане закупок».',[{t:'Открыть',act:()=>{botClose();go('plan')}}]);return out}
  if(/спасиб|класс|супер|молодец/.test(t)){botReact('happy');say('Всегда рад помочь! 🍳');return out}
  return null}
function botContext(){const s=S.settings;const T=today();const N=normK();const es=diary().filter(e=>e.d===T);
  const have=new Set(fridge().map(f=>f.t));const c=cookableFrom(have);const h=habits();const cm=mkey(T);
  const cu=s.cuisine||'ru';const cat=usableR().filter(r=>(r.cu===cu||r.cu==='base')&&goalOk(r,s.goal)).sort((a,b)=>prefScore(b)-prefScore(a)).slice(0,60).map(r=>r.name+' ('+r.kcal+' ккал)');
  return {
   'сейчас':new Date().toLocaleString('ru-RU',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}),
   'кухня_по_умолчанию':CUISINES[cu].name,'цель':s.goal==='lose'?'похудение':'набор веса','норма_ккал_в_день':N,
   'съедено_сегодня':{'ккал':es.reduce((a,e)=>a+e.kcal,0),'блюда':es.map(e=>e.name)},
   'едоков':eaters().n,'семья':(s.family||[]).map(m=>m.name+(m.age?', '+m.age+' лет':'')),
   'нельзя_использовать_продукты':[...exSet()].map(tName),
   'холодильник':fridge().map(f=>({'продукт':tName(f.t),'осталось':f.g?fmtQ(f.t,f.g):'есть','дней_до_конца_срока':daysLeft(f.exp)})),
   'заканчивается':stockAlerts().map(a=>tName(a.t)),'список_покупок':(s.shop?s.shop.items.filter(i=>!i.done):[]).map(i=>tName(i.t)),
   'можно_приготовить_сейчас':c.ready.slice(0,12).map(x=>x.r.name),'не_хватает_одного_продукта':c.almost.slice(0,6).map(x=>x.r.name+' (нужно: '+tName(x.miss[0][0])+')'),
   'любимые_блюда':h?Object.entries(h.dish).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id])=>(R.find(r=>r.id===id)||{}).name).filter(Boolean):[],
   'часто_покупает':h?h.prod.filter(p=>p.n>=2).slice(0,8).map(p=>tName(p.t)):[],
   'бюджет_месяц':{'потрачено':Math.round(byMonth()[cm]||0),'лимит':+s.budget||0,'валюта':cur()},
   'рецепты_в_приложении':cat}}
function botSystem(){return `Ты — ${botName()}, живой и умный помощник-повар в приложении «Корзина и плита» (покупки, холодильник, рецепты, меню, бюджет, дневник питания).
Характер: тёплый, остроумный, заботливый, говоришь на «вы», по-русски, естественно, как опытный друг-повар. Отвечай по существу: обычно 1–5 предложений; если просят рецепт — дай понятные шаги списком «•». Без таблиц и без markdown-заголовков. Помни ход разговора и уточняй, если вопрос неясен.
Правила:
• Опирайся на данные пользователя ниже. Сначала предлагай блюда из «можно_приготовить_сейчас», затем из «рецепты_в_приложении». Можешь предлагать и другие блюда, если просят.
• Никогда не предлагай продукты из «нельзя_использовать_продукты» — это ограничения или аллергии.
• Не выдумывай цены и факты о пользователе. Если данных нет — так и скажи.
• О здоровье и диетах — общие советы, при симптомах советуй врача.
• На темы не про еду отвечай коротко и дружелюбно возвращай к кухне.
• Ты можешь выполнять действия в приложении. Добавляй действие, только если пользователь об этом просит или явно соглашается.
Отвечай ТОЛЬКО JSON без пояснений вокруг:
{"answer":"текст ответа","actions":[...]}
Доступные действия:
{"type":"add_to_list","items":["молоко","яйца"]} — добавить продукты в список покупок
{"type":"open_recipe","name":"точное название рецепта из приложения"} — показать кнопку рецепта
{"type":"open","section":"home|buy|prices|cook|diary|fridge|plan|keep"} — показать кнопку раздела
{"type":"log_food","name":"блюдо или продукт","amount":1} — записать съеденное в дневник (порции для блюда, граммы для продукта)
Данные пользователя: ${JSON.stringify(botContext())}`}
function botHistory(){const h=BOT.msgs.filter(m=>!m.tmp&&m.text).slice(-14).map(m=>({role:m.who==='me'?'user':'assistant',content:m.text}));while(h.length&&h[0].role!=='user')h.shift();const o=[];h.forEach(m=>{if(o.length&&o[o.length-1].role===m.role)o[o.length-1].content+='\n'+m.content;else o.push({...m})});return o}
function findRecipe(name){const n=String(name||'').toLowerCase().replace(/ё/g,'е').trim();if(!n)return null;return usableR().find(r=>r.name.toLowerCase().replace(/ё/g,'е')===n)||usableR().find(r=>r.name.toLowerCase().replace(/ё/g,'е').includes(n))||usableR().find(r=>n.includes(r.name.toLowerCase().replace(/ё/g,'е')))}
const SECT={home:'Обзор',buy:'Покупки',prices:'Цены и магазины',cook:'Что приготовить',diary:'Дневник',fridge:'Холодильник',plan:'План закупок',keep:'Хранение'};
function botRunActions(acts){const btns=[];const notes=[];(Array.isArray(acts)?acts:[]).slice(0,6).forEach(a=>{if(!a||!a.type)return;
  if(a.type==='add_to_list'){const ok=[];(a.items||[]).forEach(x=>{const k=guessType(String(x));if(k&&!exSet().has(k)){shopAdd(k,defG(k));ok.push(tName(k))}});if(ok.length){saveSettings();render();botReact('happy');notes.push('✓ В списке: '+ok.join(', '));btns.push({t:'Открыть список',act:()=>{botClose();go('fridge')}})}}
  else if(a.type==='open_recipe'){const r=findRecipe(a.name);if(r)btns.push(rLink(r))}
  else if(a.type==='open'&&SECT[a.section]){btns.push({t:SECT[a.section],act:()=>{botClose();go(a.section)}})}
  else if(a.type==='log_food'){const r=findRecipe(a.name);const T=today();if(r){diaryAddRecipe(r,+a.amount||1,T);notes.push('✓ В дневник: '+r.name)}else{const k=guessType(String(a.name||''));if(k){diaryAddProduct(k,+a.amount>10?+a.amount:100,T);notes.push('✓ В дневник: '+tName(k))}}saveSettings();render()}});
  return {btns,notes}}
function parseAI(t){const m=String(t).replace(/```(?:json)?/g,'').match(/\{[\s\S]*\}/);if(m){try{const o=JSON.parse(m[0]);if(o&&typeof o.answer==='string')return o}catch(e){}}return {answer:String(t).replace(/```[\s\S]*?```/g,'').trim(),actions:[]}}
async function botAsk(q){botPush('me',q);
  const ai=aiReady();const loc=botAnswer(q,ai);botSet('think');
  if(loc){setTimeout(()=>{loc.forEach(m=>botPush('bot',m.text,m.btns));botSet('idle',BOT.baseProp||null)},300);return}
  if(ai){botPush('bot','Думаю…',[],true);BOT.busy=true;
    try{const raw=await aiChat(botSystem(),botHistory());const o=parseAI(raw);const res=botRunActions(o.actions);BOT.msgs=BOT.msgs.filter(m=>!m.tmp);
      botPush('bot',(o.answer||'…')+(res.notes.length?'\n'+res.notes.join('\n'):''),res.btns);botSet(res.notes.length?'happy':'idle',BOT.baseProp||null,res.notes.length?1500:0);if(!res.notes.length)botSet('idle',BOT.baseProp||null)}
    catch(e){BOT.msgs=BOT.msgs.filter(m=>!m.tmp);const l2=botAnswer(q);if(l2){l2.forEach(m=>botPush('bot',m.text,m.btns))}else botPush('bot',((e&&e.message)||'ИИ не ответил')+'. Пока могу ответить по встроенным правилам.',[{t:'Что приготовить?',q:'что приготовить'},{t:'Настройки ИИ',act:()=>{botClose();openSettings(false)}}]);botSet('think',undefined,1200)}
    BOT.busy=false;return}
  setTimeout(()=>{botPush('bot','Этого я пока не понял. Без ИИ я умею: подобрать блюдо из холодильника, собрать список покупок («добавь молоко»), рассказать, что заканчивается, сколько потрачено и где дешевле. Подключите бесплатный ИИ — и я буду поддерживать любой разговор о еде.',[{t:'Подключить ИИ',act:()=>{botClose();openSettings(false);setTimeout(()=>{const p=$('#sProv');if(p){p.scrollIntoView({block:'center'});p.focus()}},200)}},{t:'Что приготовить?',q:'что приготовить'}]);botSet('think',undefined,1200)},300)}
function botPush(who,text,btns,tmp){BOT.msgs.push({who,text,btns:btns||[],tmp});if(BOT.msgs.length>40)BOT.msgs.splice(0,BOT.msgs.length-40);if(!tmp){try{localStorage.setItem('korzina-chat',JSON.stringify(BOT.msgs.filter(m=>!m.tmp).slice(-30).map(m=>({who:m.who,text:m.text,d:today()}))))}catch(e){}}botDraw()}
function botSay(text,btns){botPush('bot',text,btns);if(!BOT.open){BOT.bubble={text,btns:btns||[]};botDrawBubble()}}
/* --- проактивные подсказки --- */
function botTips(){if(!botOn()||S.settings.botTips===false)return [];const seen=S.settings.botSeen||{};const T=today();const tips=[];const ok=k=>seen[k]!==T;
  const al=stockAlerts();if(al.length&&ok('al'))tips.push({k:'al',state:'wow',text:(al.some(a=>a.state==='out')?'Закончилось':'Заканчивается')+': '+al.map(a=>tName(a.t)).join(', ')+'. Добавить в список покупок?',btns:[{t:'Добавить',act:()=>{al.forEach(a=>shopAdd(a.t,stockFull(a.t)||defG(a.t)));saveSettings();render();botReact('happy')}}]});
  const soon=fridgeSoon();if(soon.length&&ok('soon')){const c=cookableFrom(new Set(fridge().map(f=>f.t)));const r=(c.ready.find(x=>x.r.ing.some(([k])=>soon.some(f=>f.t===k)))||{}).r;tips.push({k:'soon',state:'think',text:'Скоро испортится: '+[...new Set(soon.map(f=>tName(f.t)))].join(', ')+'.'+(r?' Можно приготовить «'+r.name+'».':''),btns:r?[rLink(r)]:[{t:'Холодильник',act:()=>go('fridge')}]})}
  const sg=adaptOn()?buySuggest():[];if(sg.length&&ok('sug'))tips.push({k:'sug',state:'idle',prop:'list',text:'Вы обычно покупаете '+sg.slice(0,3).map(x=>tName(x.t)).join(', ')+' — пора докупить?',btns:[{t:'В список',act:()=>{sg.forEach(x=>shopAdd(x.t,x.g));saveSettings();render();botReact('happy')}}]});
  const N=normK(),k=diary().filter(e=>e.d===T).reduce((a,e)=>a+e.kcal,0),hh=new Date().getHours();if(hh>=19&&k>0&&k<N*.6&&ok('kcal'))tips.push({k:'kcal',state:'idle',text:'Сегодня съедено '+k+' ккал из '+N+'. Подобрать ужин?',btns:[{t:'Что приготовить?',q:'что приготовить'}]});
  return tips}
function botNextTip(){if(BOT.open||BOT.bubble)return;const t=BOT.queue.shift();if(!t)return;const seen=S.settings.botSeen||(S.settings.botSeen={});seen[t.k]=today();saveSettings();
  botWake();botSet(t.state||'wow',t.prop!==undefined?t.prop:undefined,2500);botSnd('pop');BOT.bubble=t;botDrawBubble()}
/* --- отрисовка --- */
function botDrawBubble(){const b=$('#botBub');if(!b)return;const t=BOT.bubble;if(!t||BOT.open){b.hidden=true;return}b.hidden=false;
  b.innerHTML=`<div class="bbtxt">${esc(t.text).replace(/\n/g,'<br>')}</div><div class="bbbtn">${(t.btns||[]).map((x,i)=>`<button class="btn sm ${i?'':'pri'}" data-bb="${i}">${esc(x.t)}</button>`).join('')}<button class="btn sm ghost" data-bb="x">Позже</button></div>`;
  b.onclick=e=>{const x=e.target.closest('[data-bb]');if(!x)return;const v=x.dataset.bb;const tt=BOT.bubble;BOT.bubble=null;b.hidden=true;if(v!=='x'){const bt=tt.btns[+v];if(bt.q){botOpen();botAsk(bt.q)}else bt.act&&bt.act()}setTimeout(botNextTip,900)}}
function botDraw(){const p=$('#botPanel');if(!p)return;p.hidden=!BOT.open;if(!BOT.open)return;
  const L=$('#botLog');L.innerHTML=BOT.msgs.map((m,i)=>`<div class="bm ${m.who}">${m.tmp?'<span class="spin"></span> ':''}${esc(m.text).replace(/\n/g,'<br>')}${m.btns.length?`<div class="bmb">${m.btns.map((x,j)=>`<button class="btn sm" data-bm="${i}:${j}">${esc(x.t)}</button>`).join('')}</div>`:''}</div>`).join('');L.scrollTop=L.scrollHeight}
function botOpen(){if(!BOT.root)return;BOT.open=true;BOT.bubble=null;botDrawBubble();BOT.root.classList.add('open');{const ba=$('#botAi');if(ba){const c=aiCfg();ba.innerHTML=aiReady()?'<span class="pill good">ИИ: '+esc((AI_PROV[c.prov]||{}).name||'')+'</span>':'<span class="pill">ИИ не подключён — отвечаю по правилам</span> <button class="btn sm ghost" id="botAiOn">Подключить</button>';const bo=$('#botAiOn');if(bo)bo.onclick=()=>{botClose();openSettings(false)}}}botWake();botSet('happy',undefined,900);botSnd('open');
  if(!BOT.msgs.length){try{const old=JSON.parse(localStorage.getItem('korzina-chat')||'[]').filter(m=>m.d===today());old.forEach(m=>BOT.msgs.push({who:m.who,text:m.text,btns:[]}))}catch(e){}}
  if(!BOT.msgs.length){const h=new Date().getHours();botPush('bot',(h<12?'Доброе утро':h<18?'Привет':'Добрый вечер')+'! Я '+botName()+', ваш помощник на кухне. Чем помочь?',[{t:'Что приготовить?',q:'что приготовить'},{t:'Что купить?',q:'что купить'},{t:'Что заканчивается?',q:'что заканчивается'},{t:'Траты за месяц',q:'сколько потратил'}])}
  botDraw();setTimeout(()=>{const i=$('#botIn');i&&i.focus()},50)}
function botClose(){if(!BOT.root)return;BOT.open=false;BOT.root.classList.remove('open');botDraw();setTimeout(botNextTip,1500)}
function botApplySize(){if(!BOT.root)return;const v=Math.max(50,Math.min(180,+S.settings.botSize||100));BOT.root.style.setProperty('--bs',v/100)}
function botSize(d){S.settings.botSize=Math.max(50,Math.min(180,(+S.settings.botSize||100)+d));saveSettings();botApplySize();botJump();toast('Размер помощника: '+S.settings.botSize+'%')}
function botToggle(on){S.settings.bot=on;saveSettings();if(!BOT.root)botInit();BOT.root.hidden=!on;if(!on){botClose();BOT.root.hidden=true;toast('Помощник скрыт','Вернуть',()=>botToggle(true))}else{botWake();botWave()}render()}
function botInit(){if(BOT.root){BOT.root.hidden=!botOn();return}
  const root=document.createElement('div');root.id='botRoot';root.innerHTML=`<div id="botPanel" class="botpanel" hidden role="dialog" aria-label="Помощник"><div class="bph"><span class="bpav">${chefSVG()}</span><b id="botTitle">${esc(botName())}</b><span class="hint">помощник на кухне</span><button class="iconbtn" id="botSm" title="Меньше" aria-label="Уменьшить помощника">−</button><button class="iconbtn" id="botLg" title="Больше" aria-label="Увеличить помощника">+</button><button class="iconbtn" id="botNew" title="Новый разговор" aria-label="Новый разговор">↺</button><button class="iconbtn" id="botHide" title="Скрыть помощника" aria-label="Скрыть помощника">⏻</button><button class="iconbtn" id="botX" aria-label="Закрыть">×</button></div><div class="bai" id="botAi"></div><div id="botLog" class="botlog"></div><div class="bchips">${['Что приготовить?','Что купить?','Что заканчивается?','Калории сегодня'].map(x=>`<button class="chip" data-bq="${x}">${x}</button>`).join('')}</div><form id="botForm" class="bform" autocomplete="off"><input id="botIn" class="inp" placeholder="Спросите или попросите: «добавь молоко»" aria-label="Сообщение помощнику"><button class="btn pri" type="submit">➤</button></form></div>
   <div id="botBub" class="botbub" hidden></div><button id="botChef" class="botchef" aria-label="Помощник ${esc(botName())}">${chefSVG()}</button>`;
  document.body.appendChild(root);BOT.root=root;BOT.el=root.querySelector('#botChef .chef');root.hidden=!botOn();
  botSet('sleep',null);setTimeout(()=>{botSet('wow',null,800);setTimeout(()=>{botWave();botSnd('pop')},400)},600);
  root.querySelector('#botChef').addEventListener('click',()=>{BOT.pokes++;clearTimeout(BOT.pokeT);BOT.pokeT=setTimeout(()=>BOT.pokes=0,1200);
    if(BOT.pokes>=5){botSet('dizzy',undefined,2200);BOT.el.parentNode.classList.remove('shake');void BOT.el.offsetWidth;BOT.el.parentNode.classList.add('shake');botSnd('grr');return}
    if(BOT.pokes>=3){botSet('grr',undefined,1200);botSnd('grr');return}
    BOT.open?botClose():botOpen()});
  root.querySelector('#botX').onclick=botClose;
  root.querySelector('#botSm').onclick=()=>botSize(-10);root.querySelector('#botLg').onclick=()=>botSize(10);
  root.querySelector('#botNew').onclick=()=>{BOT.msgs=[];try{localStorage.removeItem('korzina-chat')}catch(e){}botOpen()};
  root.querySelector('#botHide').onclick=()=>botToggle(false);
  botApplySize();
  root.querySelector('#botForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#botIn');const v=i.value.trim();if(!v)return;i.value='';botAsk(v)});
  root.querySelector('.bchips').onclick=e=>{const b=e.target.closest('[data-bq]');if(b)botAsk(b.dataset.bq)};
  root.querySelector('#botLog').onclick=e=>{const b=e.target.closest('[data-bm]');if(!b)return;const [i,j]=b.dataset.bm.split(':').map(Number);const bt=BOT.msgs[i]&&BOT.msgs[i].btns[j];if(!bt)return;if(bt.q)botAsk(bt.q);else bt.act&&bt.act()};
  document.addEventListener('pointermove',e=>{if(!BOT.el||BOT.sleeping)return;BOT.lastAct=Date.now();const r=BOT.el.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.5);const d=Math.hypot(dx,dy)||1;const k=Math.min(1,d/300);const g=BOT.el.querySelector('.ceyes');if(g)g.setAttribute('transform',`translate(${(dx/d*4*k).toFixed(1)} ${(dy/d*3*k).toFixed(1)})`)},{passive:true});
  ['keydown','pointerdown'].forEach(ev=>document.addEventListener(ev,()=>{if(BOT.sleeping)botWake();BOT.lastAct=Date.now()},{passive:true}));
  setInterval(()=>{if(!BOT.el||BOT.open)return;const idle=Date.now()-BOT.lastAct;if(!BOT.sleeping&&idle>90000){BOT.sleeping=true;botSet('sleep',null)}
    else if(!BOT.sleeping&&BOT.state==='idle'){if(Math.random()<.35){const g=BOT.el.querySelector('.ceyes');g.innerHTML=EYES.sleep;setTimeout(()=>{if(BOT.state==='idle')g.innerHTML=EYES.idle},140)}else if(Math.random()<.04){BOT.el.parentNode.classList.add('yawn');setTimeout(()=>BOT.el.parentNode.classList.remove('yawn'),1500)}}},2600);
  BOT.queue=botTips();setTimeout(botNextTip,3500);
  const fav=document.querySelector('link[rel="icon"]')||document.head.appendChild(Object.assign(document.createElement('link'),{rel:'icon'}));fav.href=LOGO;}
// реакция на события приложения
const _toast=toast;toast=function(t,label,fn){_toast(t,label,fn);if(!botOn())return;if(/^(Добавлено|Куплено|Приятного|Сохранено|Записано|Вес записан|Рецепт сохран|Всё из списка)/.test(t))botReact('happy');else if(/^(Закончилось|Заканчивается)/.test(t))botReact('wow')};
setTimeout(botInit,900);

window.__back=function(){
  if($('#msheet').innerHTML){closeSheet();return true}
  if($('#palette').innerHTML){closePalette();return true}
  if($('#calcEl')){$('#calcEl').remove();return true}
  if(typeof CK!=='undefined'&&CK){closeCook();return true}
  if($('#shopEl')){shopClose();render();return true}
  if($('#modal').innerHTML){if(!S.settings.cuisine)return true;$('#modal').innerHTML='';render();return true}
  if(ui.drawer){closeDrawer();return true}
  if(BOT.open){botClose();return true}
  if(BOT.bubble){BOT.bubble=null;botDrawBubble();return true}
  if(ui.recipe){ui.recipe=null;render();return true}
  if(ui.tab!=='home'){go('home');return true}
  return false};
/* ===================== Запуск ===================== */
lsLoad();setupApi();render();
(async()=>{
  try{const h=await IDB.get('file');
    if(h){const p=await h.queryPermission({mode:'readwrite'});
      if(p==='granted'){await readFile(h).catch(()=>{});fileH=h}else ui.dbGrant=h;}
  }catch(e){}
  loaded=true;render();
  if(!S.settings.cuisine)openSettings(true);
})();
</script>
