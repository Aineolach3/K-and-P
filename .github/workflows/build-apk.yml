name: Собрать APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk korzina-i-plita.apk

      - uses: actions/upload-artifact@v4
        with:
          name: korzina-i-plita-apk
          path: korzina-i-plita.apk
