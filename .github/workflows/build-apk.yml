name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls $ANDROID_HOME/platforms || true
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk korzina-i-plita.apk

      - uses: actions/upload-artifact@v4
        with:
          name: korzina-i-plita-apk
          path: korzina-i-plita.apk

      - name: Опубликовать в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" korzina-i-plita.apk \
            --repo "${{ github.repository }}" \
            --title "Корзина и плита $TAG" \
            --notes "Скачайте korzina-i-plita.apk и откройте на телефоне (Android 10+). Обновление ставится поверх, данные сохраняются." \
            --latest
